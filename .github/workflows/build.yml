name: Build and Analyze

on:
  push:
    branches:
      - develop
      - test
      - prod
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build, Test and SonarCloud Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build, test and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          chmod +x vibecheck/mvnw
          cd vibecheck && ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=VibeCheckTim1_vibecheck \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

  deploy-frontend:
    name: Deploy frontend after backend
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/prod'

    steps:
      - name: Wait for backend to be healthy
        run: |
          for i in $(seq 1 40); do
            if curl -fsS https://vibecheck-gku9.onrender.com/health; then
              echo "backend up"; exit 0
            fi
            echo "waiting for backend... ($i)"; sleep 15
          done
          echo "backend never came up"; exit 1

      - name: Trigger frontend deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}"
