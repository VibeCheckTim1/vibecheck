name: E2E Tests

on:
  push:
    branches:
      - develop
      - test
      - prod
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  playwright:
    name: Playwright e2e tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      JWT_SECRET: ci-test-secret-needs-to-be-long-enough-for-hs256-algorithm-32-bytes
      GOOGLE_CLIENT_ID: ci-dummy-google-client-id
      GOOGLE_CLIENT_SECRET: ci-dummy-google-client-secret
      SPOTIFY_CLIENT_ID: ci-dummy-spotify-client-id
      SPOTIFY_CLIENT_SECRET: ci-dummy-spotify-client-secret
      CLOUDINARY_CLOUD_NAME: ci-dummy
      CLOUDINARY_API_KEY: ci-dummy-key
      CLOUDINARY_API_SECRET: ci-dummy-secret
      MAIL_USERNAME: ci@example.com
      MAIL_APP_PASSWORD: ci-dummy

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Make mvnw executable
        run: chmod +x vibecheck/mvnw

      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
